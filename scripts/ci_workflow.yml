name: Verify research prototype
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m patientwatch.pipeline
